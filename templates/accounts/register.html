{% extends 'base.html' %}

{% block content %}
<div class="flex justify-center mt-10">
    <div class="cartoon-card bg-white p-8 rounded-2xl max-w-md w-full border-sifess-pink">
        <h2 class="text-3xl font-bold text-center mb-6">Join the Fun! 🎉</h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
            <div>
                <label class="block font-bold text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                <p class="text-gray-400 text-xs mt-1">{{ field.help_text }}</p>
                {% endif %}
                {% if field.errors %}
                <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit"
                class="w-full cartoon-btn bg-sifess-pink text-white font-bold py-3 rounded-xl hover:bg-red-400 mt-4">
                Create Account
            </button>
        </form>

        <p class="text-center mt-6 font-semibold text-gray-500">
            Already have one? <a href="{% url 'login' %}" class="text-sifess-cyan hover:underline">Login instead.</a>
        </p>
    </div>
</div>
{% endblock %}
