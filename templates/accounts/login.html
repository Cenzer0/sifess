{% extends 'base.html' %}

{% block content %}
<div class="flex justify-center mt-10">
    <div class="cartoon-card bg-white p-8 rounded-2xl max-w-md w-full">
        <h2 class="text-3xl font-bold text-center mb-6">Welcome Back! 👋</h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
            <div>
                <label class="block font-bold text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit"
                class="w-full cartoon-btn bg-sifess-cyan text-gray-900 font-bold py-3 rounded-xl hover:bg-blue-300 mt-4">
                Login
            </button>
        </form>

        <p class="text-center mt-6 font-semibold text-gray-500">
            No account? <a href="{% url 'register' %}" class="text-sifess-pink hover:underline">Get one here.</a>
        </p>
    </div>
</div>
{% endblock %}
